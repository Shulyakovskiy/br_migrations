services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: br_migrations_demo
      POSTGRES_PASSWORD: local-demo-password
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "br_migrations_demo"]
      interval: 1s
      timeout: 3s
      retries: 30
