workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

test:
  image: ghcr.io/astral-sh/uv:0.12.2-python3.12-bookworm-slim
  tags:
    - registry-deploy
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    HEALTHCHECK_TCP_PORT: "2375"
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    UV_LINK_MODE: copy
    UV_CACHE_DIR: .uv-cache
  timeout: 10m
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  script:
    - uv sync --locked --no-editable
    - uv run --no-sync python -m django test --settings=tests.settings -v 2
    - uv build
  after_script:
    - uv cache prune --ci
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: 7 days
